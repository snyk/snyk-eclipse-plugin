version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1

jobs:
  security-scans:
    resource_class: small
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - prodsec/security_scans:
          mode: auto
          open-source-agentic-fix-enabled: true
          open-source-scan-all-projects: true
          open-source-additional-arguments: --exclude=tests
          iac-scan: disabled

  test-linux:
    resource_class: medium
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - restore_cache:
          name: Restore Maven/Tycho cache
          keys:
            - m2-linux-v1-{{ checksum "pom.xml" }}-{{ checksum "plugin/pom.xml" }}-{{ checksum "tests/pom.xml" }}
            - m2-linux-v1-
      - run:
          name: Build and test with Maven
          command: ./mvnw clean verify -DtrimStackTrace=false
      - save_cache:
          name: Save Maven/Tycho cache
          key: m2-linux-v1-{{ checksum "pom.xml" }}-{{ checksum "plugin/pom.xml" }}-{{ checksum "tests/pom.xml" }}
          paths:
            - ~/.m2/repository
      - store_test_results:
          path: tests/target/surefire-reports
      - store_artifacts:
          path: tests/target/surefire-reports

  test-macos:
    resource_class: m4pro.medium
    macos:
      xcode: 16.4.0
    steps:
      - checkout
      - restore_cache:
          name: Restore Maven/Tycho cache
          keys:
            - m2-macos-v1-{{ checksum "pom.xml" }}-{{ checksum "plugin/pom.xml" }}-{{ checksum "tests/pom.xml" }}
            - m2-macos-v1-
      - run:
          name: Install Temurin JDK 17
          command: |
            curl -fsSL -o /tmp/temurin17.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
            sudo mkdir -p /Library/Java/JavaVirtualMachines
            sudo tar -xzf /tmp/temurin17.tar.gz -C /Library/Java/JavaVirtualMachines
            echo 'export JAVA_HOME=$(/usr/libexec/java_home -v 17)' >> "$BASH_ENV"
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Build and test with Maven
          command: ./mvnw clean verify -DtrimStackTrace=false
      - save_cache:
          name: Save Maven/Tycho cache
          key: m2-macos-v1-{{ checksum "pom.xml" }}-{{ checksum "plugin/pom.xml" }}-{{ checksum "tests/pom.xml" }}
          paths:
            - ~/.m2/repository
      - store_test_results:
          path: tests/target/surefire-reports
      - store_artifacts:
          path: tests/target/surefire-reports

  test-windows:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
    steps:
      - checkout
      - restore_cache:
          name: Restore Maven/Tycho cache
          keys:
            - m2-windows-v1-{{ checksum "pom.xml" }}-{{ checksum "plugin/pom.xml" }}-{{ checksum "tests/pom.xml" }}
            - m2-windows-v1-
      - run:
          name: Install Temurin JDK 17
          shell: powershell.exe -ExecutionPolicy Bypass
          command: choco install temurin17 -y --no-progress
      - run:
          name: Build and test with Maven
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $javaHome = (Get-ChildItem "C:\Program Files\Eclipse Adoptium" -Directory |
              Where-Object { $_.Name -like "jdk-17*" } |
              Select-Object -First 1).FullName
            $env:JAVA_HOME = $javaHome
            $env:PATH = "$javaHome\bin;$env:PATH"
            & .\mvnw.cmd clean verify "-DtrimStackTrace=false"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - save_cache:
          name: Save Maven/Tycho cache
          key: m2-windows-v1-{{ checksum "pom.xml" }}-{{ checksum "plugin/pom.xml" }}-{{ checksum "tests/pom.xml" }}
          paths:
            - C:\Users\circleci\.m2\repository
      - store_test_results:
          path: tests/target/surefire-reports
      - store_artifacts:
          path: tests/target/surefire-reports

workflows:
  version: 2
  CICD:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: snyk-on-snyk-devex_ide
          trusted-branch: main

      - security-scans:
          context:
            - devex_ide
            - prodsec-orb-runtime

      - test-linux

      - test-macos

      - test-windows
